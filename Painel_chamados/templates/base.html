<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="icon" type="image/png" href="/img/logocref.png" />
    <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}?v={{ asset_versions.styles if asset_versions is defined else 0 }}" />
    <script src="{{ request.url_for('static', path='common.js') }}?v={{ asset_versions.common if asset_versions is defined else 0 }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="logo-wrap">
            <img class="logo" src="/img/logocref.png" alt="CREF 13/BA" />
          </div>
          <div class="brand-text">
            <h1>{{ title }}</h1>
            <p>Painel de chamados - Conselho Regional de Educação Física</p>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="badge">Serviço Público Federal</div>
        </div>
      </header>
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
